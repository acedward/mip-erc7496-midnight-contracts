# Continuous integration for mip-erc7496-midnight-contracts.
#
# WHAT THIS DOES: installs the pinned dependency set from the committed lockfile,
# type-checks the TypeScript (scripts, tests, and the compactc-generated modules
# under contracts/managed/), and runs the simulator test suite.
#
# WHAT THIS DELIBERATELY DOES NOT DO: it does NOT run the Compact compiler.
#   * `compact` / `compactc` 0.34.0 is installed per-developer under ~/.compact and
#     is not available as a pinned, non-interactively installable action today, so a
#     CI compile step would either be flaky or would silently fall back to whatever
#     toolchain version the runner happens to have — which is worse than no check.
#   * `contracts/managed/` IS THE COMMITTED ARTEFACT. The generated TypeScript, the
#     ZKIR and the compiler metadata are in git and are what the tests below actually
#     load and execute, so every test here runs against the real compiler output.
#     (Proving/verifier keys are not committed — a k=19 `.prover` is ~134 MB and is a
#     pure function of the committed ZKIR.)
#   * The equivalence check between the sources and the committed artefacts is
#     `./scripts/compile.sh --check` (compiles to a temp tree and diffs), run
#     LOCALLY by whoever edits a `.compact` file. Wire it into CI the day the 0.34.0
#     toolchain can be installed non-interactively and pinned by version.
#
# It also does not deploy anything: every on-chain step needs the Stagenet deployer
# wallet and a local proof server, both out of scope for CI.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Reproducible from the committed package-lock.json. Note for maintainers: plain
      # `npm install` with this package.json's `overrides` block crashes npm 11.4.2
      # ("Cannot read properties of null (reading 'edgesOut')") — `npm ci` does not.
      - name: Install (locked)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (Compact simulator — no node, indexer, proof server or wallet)
        run: npx vitest run
